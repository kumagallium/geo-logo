name: Desktop Build

# タグが打たれたら、デスクトップアプリを組んで Release に添付し、自動更新の
# 案内（latest.json）を作る。tagpr が GITHUB_TOKEN で push するので release
# イベントからは起動しない。tagpr.yml が workflow_dispatch で明示的に叩く。
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write
  # 最後に Pages のデプロイを起こすために要る（updater/latest.json を配信するため）。
  # 既定の GITHUB_TOKEN には actions スコープが無く、明示しないと 403 で落ちる
  actions: write
  # ビルドが静かに失敗して「更新されない」で気づく事故を防ぐため、失敗時に Issue を起票する
  issues: write

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.resolve.outputs.release_id }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve release ID
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.payload.release?.tag_name || '${{ inputs.release_tag }}';
            core.setOutput('tag', tag);
            if (context.payload.release?.id) {
              core.setOutput('release_id', context.payload.release.id);
              return;
            }
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag,
            });
            core.setOutput('release_id', release.id);

  # macOS Apple Silicon のみ。Windows / Intel macOS は、そのターゲットで通しの
  # 検証をする人がいないので止めている（Graphium と同じ判断）
  build:
    needs: resolve-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macOS (Apple Silicon)

    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-release.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle Node.js runtime for sidecar
        run: node scripts/fetch-node.mjs

      - name: Bundle server
        run: node scripts/bundle-server.mjs

      # バンドル直後に sidecar を実起動して /api/health を確かめる。ESM bundle で
      # __dirname が無い罠、新しい依存が package 内の資産を読みに行って起動即死する
      # 罠を、配布前に確実に拾う
      - name: Smoke test bundled sidecar
        shell: bash
        run: |
          set -euo pipefail
          PORT=13001
          DATA_DIR=$(mktemp -d)
          GEOLOGO_PORT=$PORT DATA_DIR=$DATA_DIR node src-tauri/sidecar/server.mjs > /tmp/sidecar-smoke.log 2>&1 &
          SIDECAR_PID=$!
          trap "kill $SIDECAR_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 15); do
            if curl -fsS "http://127.0.0.1:${PORT}/api/health" > /tmp/sidecar-health.json 2>/dev/null; then
              echo "Sidecar healthy after ${i}s"; cat /tmp/sidecar-health.json; echo ""; exit 0
            fi
            if ! kill -0 $SIDECAR_PID 2>/dev/null; then
              echo "ERROR: Sidecar died"; cat /tmp/sidecar-smoke.log; exit 1
            fi
            sleep 1
          done
          echo "ERROR: Sidecar did not respond within 15s"; cat /tmp/sidecar-smoke.log; exit 1

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # Apple Developer ID の署名と公証（macOS）。tauri-action が APPLE_CERTIFICATE
          # （base64 の .p12）を一時 Keychain に読み込み、APPLE_SIGNING_IDENTITY で
          # 署名し、APPLE_ID + APPLE_PASSWORD（App 用パスワード）で公証へ出す。
          # secrets が無ければ署名なしで組む（Gatekeeper の警告は出るが動く）
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.resolve-release.outputs.release_id }}
          # updater の JSON は tauri-action に任せない（署名の扱いが不安定。Graphium
          # で実害）。.app.tar.gz だけ上げさせ、署名と latest.json は次のジョブで作る
          includeUpdaterJson: false
          args: --target ${{ matrix.target }}

  # ビルド後、updater バンドルに署名して latest.json を作り、Release と Pages の両方に置く
  generate-updater-json:
    needs: [resolve-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Download and sign updater bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -uo pipefail
          TAG="${{ needs.resolve-release.outputs.tag }}"
          REPO="${{ github.repository }}"
          mkdir -p /tmp/assets
          MAC_BUNDLE="geo-logo_aarch64.app.tar.gz"
          gh release download "$TAG" --pattern "$MAC_BUNDLE" --dir /tmp/assets --repo "$REPO" --clobber 2>/dev/null \
            || echo "WARNING: ${MAC_BUNDLE} not found"
          if [ -f "/tmp/assets/$MAC_BUNDLE" ]; then
            tauri signer sign "/tmp/assets/$MAC_BUNDLE" -k "$TAURI_SIGNING_PRIVATE_KEY" -p "" 2>&1 \
              || echo "WARNING: signing failed"
          fi
          ls -la /tmp/assets/ || true

      - name: Build latest.json
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve-release.outputs.tag }}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          MAC_BUNDLE="geo-logo_aarch64.app.tar.gz"
          SIG=""
          [ -f "/tmp/assets/${MAC_BUNDLE}.sig" ] && SIG="$(cat "/tmp/assets/${MAC_BUNDLE}.sig")"
          if [ -z "$SIG" ]; then
            # 署名が無い＝バンドルが欠けたか署名に失敗した。壊れた案内（署名空・URL 無し）
            # を絶対に配らない。ここで止める
            echo "::error::No updater signature for ${MAC_BUNDLE}; refusing to publish latest.json"
            exit 1
          fi
          jq -n \
            --arg v "$VERSION" \
            --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg sig "$SIG" \
            --arg url "${BASE_URL}/${MAC_BUNDLE}" \
            '{version: $v, notes: "See the changelog for details.", pub_date: $d, platforms: {"darwin-aarch64": {signature: $sig, url: $url}}}' \
            > /tmp/latest.json
          cat /tmp/latest.json

      - name: Upload latest.json to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.resolve-release.outputs.tag }}" /tmp/latest.json --clobber --repo "${{ github.repository }}"

      # Pages でも配信する（GitHub の release/latest/download はリダイレクトを挟むので、
      # 直接読める場所も持っておく）。deploy.yml が public/updater/latest.json を拾う
      - name: Commit latest.json for Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" /tmp/repo
          mkdir -p /tmp/repo/public/updater
          cp /tmp/latest.json /tmp/repo/public/updater/latest.json
          cd /tmp/repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/updater/latest.json
          git diff --cached --quiet || git commit -m "chore: publish updater latest.json for ${{ needs.resolve-release.outputs.tag }} [skip ci]"
          git push

      - name: Trigger Pages deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy to GitHub Pages" --repo "${{ github.repository }}"

  # ビルドが失敗したら Issue を立てる。公証の失敗（Apple 規約の失効など）は静かに
  # 落ちて「更新されない」で気づく事故になりやすい
  notify-on-failure:
    needs: [resolve-release, build, generate-updater-json]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Desktop build failed for ${{ needs.resolve-release.outputs.tag }}" \
            --body "See https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
