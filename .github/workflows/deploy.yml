name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 既定の書き込み権限を全ジョブで落とし、必要な権限だけ job 単位で足す
permissions: {}

# 進行中のデプロイはキャンセルせず、直列化して最後の push を反映させる
concurrency:
  group: pages
  cancel-in-progress: false

# サードパーティ action は「タグ」ではなく commit SHA で固定する。
# タグは可変なので、上書きされるとデプロイ成果物へ任意コードを混ぜられる。
# 更新は Dependabot（.github/dependabot.yml）が PR で提案する。
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # バージョンは package.json の packageManager を正とする。
      # ここで version を指定すると両者の指定が衝突してエラーになる。
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: lockfile と package.json の不一致で落とす。
      # --ignore-scripts: 依存の postinstall を走らせない（供給網対策）。
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm typecheck
      - run: pnpm test

      - name: Build
        # Pages は https://<user>.github.io/<repo>/ で配信されるので base を合わせる
        env:
          GEOLOGO_BASE: /${{ github.event.repository.name }}/
        run: pnpm build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
